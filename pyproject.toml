[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tri-it-yourself"
version = "0.1.0"
description = "Ternary-weight (2-bit) LLM pretraining in JAX: a looped-depth transformer trained with Muon and a latent-free stochastic sign optimizer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.38",
    "optax>=0.2.4",  # optax.tree.norm
    "numpy>=1.26",
]

[project.optional-dependencies]
data = ["datasets>=2.19", "tokenizers>=0.19", "tiktoken>=0.7"]
tune = ["optuna>=3.6"]
dev = ["pytest>=8.0", "optuna>=3.6"]

[tool.hatch.build.targets.wheel]
packages = ["tri"]
